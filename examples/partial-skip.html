<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partial Generation Test - Skip Phases</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 2000px;
    }
    .map-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #map {
      border: 2px solid #444;
      background: #000;
      display: block;
      max-width: 100%;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 5px;
      max-width: 600px;
      width: 100%;
    }
    .info h3 {
      margin-top: 0;
    }
    .metric {
      margin: 10px 0;
      padding: 8px;
      background: #333;
      border-radius: 3px;
    }
    .metric strong {
      color: #4a9eff;
    }
    .metric.success {
      background: #2a4a2a;
      border-left: 3px solid #4a9f4a;
    }
    .metric.warning {
      background: #4a4a2a;
      border-left: 3px solid #9f9f4a;
    }
    pre {
      background: #000;
      padding: 10px;
      border-radius: 3px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .comparison {
      margin-top: 20px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Partial Generation Test - Skip Phases (Terrain Only)</h1>
  <div class="container">
    <div class="map-container">
      <div id="map"></div>
      <div class="info">
        <h3>Generation Info</h3>
        <div class="metric"><strong>Seed:</strong> <span id="seed">-</span></div>
        <div class="metric"><strong>Generation Time:</strong> <span id="time">-</span> ms</div>
        <div class="metric"><strong>Skipped Phases:</strong> <span id="skipped">-</span></div>
        <div class="metric"><strong>Data Size:</strong> <span id="dataSize">-</span> bytes</div>
        <h3>Data Summary</h3>
        <pre id="summary"></pre>
        <div class="comparison" id="comparison" style="display: none;">
          <h3>Comparison with Full Generation</h3>
          <div id="comparisonResults"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    /**
     * Partial generation test using skipPhases option
     * Skips political phases (cultures, burgs, states, provinces, religions, emblems)
     * to generate terrain-only map
     */
    
    import Delaunator from 'https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm';
    
    const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const { 
      initGenerator, 
      loadOptions, 
      generateMap, 
      getMapData,
      renderPreviewSVG,
      PHASES
    } = await import(isDev ? '/src/index.js' : '/dist/azgaar-genesis.esm.js');

    const container = document.getElementById('map');
    const seed = 'test-seed-42'; // Same seed as full-gen.html
    const skippedPhases = [
      PHASES.CULTURES,
      PHASES.BURGS,
      PHASES.STATES,
      PHASES.PROVINCES,
      PHASES.RELIGIONS,
      PHASES.EMBLEMS,
    ];
    
    const options = {
      seed,
      mapWidth: 960,
      mapHeight: 540,
      cellsDesired: 10000,
      points: 4,
      skipPhases: skippedPhases,
    };

    // Initialize and generate
    initGenerator({ container });
    loadOptions(options);
    
    const startTime = performance.now();
    const data = generateMap(Delaunator);
    const endTime = performance.now();
    const generationTime = Math.round(endTime - startTime);
    
    // Render
    renderPreviewSVG({ width: 960, height: 540 });
    
    // Get data
    const jsonData = getMapData();
    const dataSize = new Blob([JSON.stringify(jsonData)]).size;
    
    // Display results
    document.getElementById('seed').textContent = seed;
    document.getElementById('time').textContent = generationTime;
    document.getElementById('skipped').textContent = skippedPhases.join(', ');
    document.getElementById('dataSize').textContent = dataSize.toLocaleString();
    
    // Summary
    const summary = {
      seed: jsonData.seed,
      grid: {
        cells: jsonData.grid.cells.i.length,
        features: jsonData.grid.features?.length || 0,
      },
      pack: {
        cells: jsonData.pack.cells.i.length,
        features: jsonData.pack.features?.length || 0,
        rivers: jsonData.pack.rivers?.length || 0,
        cultures: jsonData.pack.cultures?.length || 0,
        burgs: jsonData.pack.burgs?.length || 0,
        states: jsonData.pack.states?.length || 0,
        provinces: jsonData.pack.provinces?.length || 0,
        religions: jsonData.pack.religions?.length || 0,
      }
    };
    
    document.getElementById('summary').textContent = JSON.stringify(summary, null, 2);
    
    // Compare with full generation if available
    if (window.fullGenData) {
      const comparison = compareData(window.fullGenData.jsonData, jsonData);
      const timeSaved = window.fullGenData.generationTime - generationTime;
      const timeSavedPercent = ((timeSaved / window.fullGenData.generationTime) * 100).toFixed(1);
      
      let comparisonHTML = `
        <div class="metric ${timeSaved > 0 ? 'success' : ''}">
          <strong>Time Saved:</strong> ${timeSaved} ms (${timeSavedPercent}%)
        </div>
        <div class="metric ${comparison.terrainMatch ? 'success' : 'warning'}">
          <strong>Terrain Match:</strong> ${comparison.terrainMatch ? '✓ Match' : '✗ Mismatch'}
        </div>
        <div class="metric">
          <strong>Terrain Differences:</strong> ${comparison.terrainDiffs}
        </div>
        <div class="metric">
          <strong>Political Data:</strong> ${comparison.politicalStatus}
        </div>
      `;
      
      document.getElementById('comparisonResults').innerHTML = comparisonHTML;
      document.getElementById('comparison').style.display = 'block';
    }
    
    // Store in window
    window.partialSkipData = {
      jsonData,
      generationTime,
      dataSize,
      summary,
      svg: container.innerHTML,
      skippedPhases,
    };
    
    console.log('Partial generation (skip) complete:', {
      time: generationTime,
      dataSize,
      skippedPhases,
      summary,
    });
    
    /**
     * Compare two map data objects
     */
    function compareData(fullData, partialData) {
      const result = {
        terrainMatch: true,
        terrainDiffs: 0,
        politicalStatus: 'Skipped (expected)',
      };
      
      // Compare terrain data (should match)
      const fullHeights = fullData.grid.cells.h;
      const partialHeights = partialData.grid.cells.h;
      
      if (fullHeights.length !== partialHeights.length) {
        result.terrainMatch = false;
        result.terrainDiffs = 'Length mismatch';
      } else {
        let diffs = 0;
        for (let i = 0; i < fullHeights.length; i++) {
          if (fullHeights[i] !== partialHeights[i]) {
            diffs++;
          }
        }
        result.terrainDiffs = diffs;
        result.terrainMatch = diffs === 0;
      }
      
      // Check political data (should be missing/empty in partial)
      const hasPolitical = 
        (partialData.pack.cultures?.length > 0) ||
        (partialData.pack.burgs?.length > 0) ||
        (partialData.pack.states?.length > 1); // Allow default state
      
      if (hasPolitical) {
        result.politicalStatus = 'Present (unexpected)';
      }
      
      return result;
    }
  </script>
</body>
</html>
