<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas-Only Migration Test (Phase 3)</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }
    .controls {
      margin-bottom: 15px;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 5px;
    }
    button {
      padding: 8px 16px;
      margin-right: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #map-preview {
      background: #e8f4f8;
      border: 2px solid #4a4a4a;
      border-radius: 5px;
      display: block;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 5px;
      font-size: 14px;
    }
    .status.error {
      background: #4a2a2a;
      color: #ff6666;
    }
    .status.success {
      background: #2a4a2a;
      color: #66ff66;
    }
    pre {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Canvas-Only Migration Test (Phase 3)</h1>
    <div class="controls">
      <button id="generateBtn">Generate Map</button>
      <button id="exportBtn">Export Render Data</button>
      <button id="renderBtn">Render to Canvas</button>
      <button id="zoomToBurgBtn" disabled>Zoom to First Burg</button>
      <label style="margin-left: 20px; color: #aaa;">
        Mode:
        <select id="modeSelect" style="margin-left: 8px; padding: 4px; background: #2a2a2a; color: #fff; border: 1px solid #666; border-radius: 4px;">
          <option value="canvas2d" selected>Canvas 2D</option>
          <option value="webgl">WebGL (Stub)</option>
        </select>
      </label>
      <div style="margin-top: 10px; color: #aaa; font-size: 12px;">
        <span><strong>Layers:</strong></span>
        <label style="margin-left: 10px;">
          <input type="checkbox" id="layerTerrain" checked> Terrain
        </label>
        <label style="margin-left: 10px;">
          <input type="checkbox" id="layerBiomes" checked> Biomes
        </label>
        <label style="margin-left: 10px;">
          <input type="checkbox" id="layerStates"> States
        </label>
      </div>
      <div style="margin-top: 10px; color: #aaa; font-size: 12px;">
        <span>Controls: </span>
        <span>Click to highlight cell</span>
        <span style="margin-left: 15px;">Mouse wheel to zoom</span>
        <span style="margin-left: 15px;">Drag to pan</span>
      </div>
    </div>
    <canvas id="map-preview" width="960" height="540"></canvas>
    <div id="status" class="status">Ready - Click "Generate Map" to start</div>
    <div id="performance" style="margin-top: 10px; padding: 5px 10px; background: #2a2a2a; border-radius: 5px; font-size: 12px; color: #aaa; display: none;">
      <strong>Performance:</strong> <span id="perfMetrics"></span>
    </div>
    <div id="exportOutput" style="display: none; margin-top: 15px;">
      <h3>Export Data Preview:</h3>
      <pre id="exportData"></pre>
    </div>
  </div>

  <script type="module">
    // Import Delaunator (peer dependency)
    import Delaunator from 'https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm';
    
    // Import the library (using dev server or dist bundle)
    const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const libraryPath = isDev 
      ? '/src/index.js' 
      : '/dist/azgaar-library.es.js';
    
    let AzgaarGenesis;
    try {
      AzgaarGenesis = await import(libraryPath);
    } catch (error) {
      console.error(`Failed to load library from ${libraryPath}:`, error);
      document.getElementById('status').textContent = `❌ Failed to load library from ${libraryPath}. Make sure to use a dev server (e.g., npm run dev) or build first.`;
      throw error;
    }

    const { 
      initGenerator, 
      loadOptions, 
      generateMap, 
      exportRenderData, 
      getRenderer,
      getMapData
    } = AzgaarGenesis;

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('map-preview');
    const generateBtn = document.getElementById('generateBtn');
    const exportBtn = document.getElementById('exportBtn');
    const renderBtn = document.getElementById('renderBtn');
    const zoomToBurgBtn = document.getElementById('zoomToBurgBtn');
    const modeSelect = document.getElementById('modeSelect');
    const layerTerrain = document.getElementById('layerTerrain');
    const layerBiomes = document.getElementById('layerBiomes');
    const layerStates = document.getElementById('layerStates');
    const exportOutput = document.getElementById('exportOutput');
    const exportDataEl = document.getElementById('exportData');
    const performanceDiv = document.getElementById('performance');
    const perfMetricsEl = document.getElementById('perfMetrics');

    let mapData = null;
    let renderData = null;
    let renderer = null;
    let highlightedCellId = null;
    let activeLayers = ['terrain', 'biomes']; // Default active layers

    function getActiveLayers() {
      const layers = [];
      if (layerTerrain.checked) layers.push('terrain');
      if (layerBiomes.checked) layers.push('biomes');
      if (layerStates.checked) layers.push('states');
      return layers.length > 0 ? layers : ['terrain']; // Fallback to terrain if all unchecked
    }

    function updatePerformanceMetrics(label, timeMs) {
      if (!performanceDiv || !perfMetricsEl) return;
      performanceDiv.style.display = 'block';
      const existing = perfMetricsEl.textContent;
      const newMetric = `${label}: ${timeMs.toFixed(2)}ms`;
      perfMetricsEl.textContent = existing ? `${existing} | ${newMetric}` : newMetric;
    }

    function updateStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    generateBtn.addEventListener('click', async () => {
      try {
        updateStatus('Generating map...', '');
        generateBtn.disabled = true;
        const genStart = performance.now();

        // Initialize generator
        initGenerator({ canvas: null });
        
        // Load options for small test map (low density ~0.125-0.25, ~50-200 cells)
        loadOptions({ 
          seed: `test-canvas-migration-${Date.now()}`,
          mapWidth: 960,
          mapHeight: 540,
          cellsDesired: 5000, // Low density for testing
          statesNumber: 8,
          culturesNumber: 5,
          religionsNumber: 3,
        });
        
        // Generate map
        mapData = generateMap(Delaunator);
        
        const genTime = console.timeEnd('[Phase 2] Map Generation');
        updateStatus('✅ Map generated', 'success');
        updatePerformanceMetrics('Generation', performance.now() - genTime);
        exportBtn.disabled = false;
        renderBtn.disabled = false;
      } catch (error) {
        updateStatus(`❌ Error: ${error.message}`, 'error');
        console.error('Generation error:', error);
      } finally {
        generateBtn.disabled = false;
      }
    });

    exportBtn.addEventListener('click', () => {
      try {
        if (!mapData) {
          updateStatus('❌ Generate map first', 'error');
          return;
        }

        updateStatus('Exporting render data...', '');
        console.time('[Phase 3] Export Render Data');
        
        const mode = modeSelect.value;
        activeLayers = getActiveLayers();
        
        // Export render data using real library (with current layer selection)
        const exportStart = performance.now();
        renderData = exportRenderData({ mode, layers: activeLayers });
        const exportTime = performance.now() - exportStart;
        console.timeEnd('[Phase 3] Export Render Data');
        updatePerformanceMetrics('Export', exportTime);
        
        // Show preview (truncated for large maps)
        const preview = {
          mode: renderData.mode,
          cellCount: renderData.cells?.length || 0,
          sampleCell: renderData.cells?.[0] || null,
          patterns: renderData.patterns || {},
          gradients: renderData.gradients || {},
        };
        exportDataEl.textContent = JSON.stringify(preview, null, 2);
        exportOutput.style.display = 'block';
        
        updateStatus(`✅ Render data exported: ${preview.cellCount} cells (mode: ${mode})`, 'success');
        zoomToBurgBtn.disabled = false;
      } catch (error) {
        updateStatus(`❌ Export error: ${error.message}`, 'error');
        console.error('Export error:', error);
      }
    });

    renderBtn.addEventListener('click', () => {
      try {
        if (!renderData) {
          updateStatus('❌ Export render data first', 'error');
          return;
        }

        updateStatus('Rendering to canvas...', '');
        
        const mode = modeSelect.value;
        activeLayers = getActiveLayers();
        
        // Update renderData with active layers
        if (renderData && mode === 'canvas2d') {
          renderData.activeLayers = activeLayers;
        }
        
        // Get renderer using real library
        renderer = getRenderer(canvas, { 
          mode, 
          fallbackTo2D: true,
          layers: activeLayers,
          viewport: {
            offsetX: 0,
            offsetY: 0,
            scale: 1.0,
          }
        });

        // Render using Canvas2DRenderer.renderMap() or PixiRenderer.renderMap()
        const renderStart = performance.now();
        if (mode === 'canvas2d' && renderer && typeof renderer.renderMap === 'function') {
          if (typeof renderer.setActiveLayers === 'function') {
            renderer.setActiveLayers(activeLayers);
          }
          renderer.renderMap(renderData);
        } else if (mode === 'webgl') {
          if (renderer && typeof renderer.renderMap === 'function') {
            console.log('[Test] WebGL stub: Using PixiRenderer (placeholder)');
            renderer.renderMap(renderData);
          } else {
            updateStatus('⚠️ WebGL rendering is stubbed - falling back to Canvas 2D', 'error');
            if (renderer && typeof renderer.renderMap === 'function') {
              renderer.renderMap(renderData);
            }
          }
        }
        
        const renderTime = performance.now() - renderStart;
        console.log(`[Phase 3] Canvas Rendering: ${renderTime.toFixed(2)}ms`);
        updatePerformanceMetrics('Rendering', renderTime);
        updateStatus(`✅ Rendered ${renderData.cells?.length || 0} cells (layers: ${activeLayers.join(', ')})`, 'success');
      } catch (error) {
        updateStatus(`❌ Render error: ${error.message}`, 'error');
        console.error('Render error:', error);
      }
    });

    // Zoom to first burg cell
    zoomToBurgBtn.addEventListener('click', () => {
      if (!renderer || !renderData || !renderData.cells) {
        updateStatus('❌ Render map first', 'error');
        return;
      }

      // Find first cell with burg label
      const burgCell = renderData.cells.find(cell => 
        cell.labels && Array.isArray(cell.labels) && cell.labels.length > 0
      );

      if (!burgCell || !burgCell.bounds) {
        updateStatus('⚠️ No burg cells found to zoom to', 'error');
        return;
      }

      const zoomStart = performance.now();
      renderer.zoomToCell(burgCell.bounds, 3.0, true); // Smooth zoom
      const zoomTime = performance.now() - zoomStart;
      updatePerformanceMetrics('Zoom', zoomTime);
      updateStatus(`✅ Zoomed to cell ${burgCell.i} (burg: ${burgCell.labels[0]?.text || 'N/A'})`, 'success');
    });

    // Layer toggle handlers
    [layerTerrain, layerBiomes, layerStates].forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        if (!renderer || !renderData) return;
        
        activeLayers = getActiveLayers();
        renderData.activeLayers = activeLayers;
        
        // Update renderer layers if supported
        if (typeof renderer.setActiveLayers === 'function') {
          renderer.setActiveLayers(activeLayers);
        }
        
        // Re-render with new layers
        const renderStart = performance.now();
        if (typeof renderer.renderMap === 'function') {
          renderer.renderMap(renderData);
        }
        const renderTime = performance.now() - renderStart;
        updatePerformanceMetrics('Layer Toggle', renderTime);
        updateStatus(`Layers updated: ${activeLayers.join(', ')}`, 'success');
      });
    });

    // Click handler for hit-testing
    canvas.addEventListener('click', (event) => {
      if (!renderer || !renderData) return;

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

        const hitStart = performance.now();
        const hitCellId = renderer.hitTest(x, y);
        const hitTime = performance.now() - hitStart;
        if (hitCellId !== null) {
          updatePerformanceMetrics('Hit Test', hitTime);
        }

      if (hitCellId !== null) {
        const hitCell = renderData.cells.find(c => c.i === hitCellId);
        updateStatus(`🔍 Clicked cell ${hitCellId} ${hitCell?.labels?.[0]?.text ? `(${hitCell.labels[0].text})` : ''}`, 'success');
        highlightedCellId = hitCellId;
        // Optionally re-render with highlight
        renderer.renderMap(renderData);
      } else {
        updateStatus('🔍 No cell hit', '');
        highlightedCellId = null;
        renderer.renderMap(renderData);
      }
    });

    // Mouse wheel zoom
    canvas.addEventListener('wheel', (event) => {
      if (!renderer) return;
      event.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      const zoomFactor = event.deltaY > 0 ? 0.9 : 1.1;
      const newScale = Math.max(0.1, Math.min(10, renderer.viewport.scale * zoomFactor));

      // Zoom toward mouse position
      const worldX = (mouseX - renderer.viewport.offsetX) / renderer.viewport.scale;
      const worldY = (mouseY - renderer.viewport.offsetY) / renderer.viewport.scale;

      renderer.viewport.scale = newScale;
      renderer.viewport.offsetX = mouseX - worldX * newScale;
      renderer.viewport.offsetY = mouseY - worldY * newScale;

      renderer.redraw();
    });

    // Mouse drag pan
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartOffsetX = 0;
    let dragStartOffsetY = 0;

    canvas.addEventListener('mousedown', (event) => {
      if (!renderer) return;
      isDragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragStartOffsetX = renderer.viewport.offsetX;
      dragStartOffsetY = renderer.viewport.offsetY;
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('mousemove', (event) => {
      if (!renderer || !isDragging) return;
      
      const deltaX = event.clientX - dragStartX;
      const deltaY = event.clientY - dragStartY;
      
      renderer.viewport.offsetX = dragStartOffsetX + deltaX;
      renderer.viewport.offsetY = dragStartOffsetY + deltaY;
      
      renderer.redraw();
    });

    canvas.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = 'default';
      }
    });

    canvas.addEventListener('mouseleave', () => {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = 'default';
      }
    });

    // Test WebGL fallback
    modeSelect.addEventListener('change', () => {
      if (modeSelect.value === 'webgl') {
        updateStatus('⚠️ WebGL mode selected - will fallback to Canvas 2D if unavailable', '');
      }
    });
  </script>
</body>
</html>
