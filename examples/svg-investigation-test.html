<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Rendering Investigation Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    #svgContainer {
      border: 2px solid #444;
      background: #000;
      width: 960px;
      height: 540px;
      margin: 20px 0;
    }
    #svgContainer svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .info {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    pre {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #45a049;
    }
    .error {
      color: #f44;
    }
    .success {
      color: #4f4;
    }
  </style>
</head>
<body>
  <h1>SVG Rendering Investigation Test</h1>
  <p>This test investigates the SVG rendering pipeline and vertex graph structure.</p>
  
  <div>
    <button id="testBtn">Test SVG Rendering</button>
    <button id="inspectBtn">Inspect Vertex Graph</button>
  </div>
  
  <div id="svgContainer"></div>
  
  <div class="info">
    <h3>Investigation Results</h3>
    <div id="results">Click "Test SVG Rendering" to start...</div>
  </div>

  <!-- Import map to resolve bare module specifiers -->
  <script type="importmap">
    {
      "imports": {
        "delaunator": "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm"
      }
    }
  </script>

  <script type="module">
    import Delaunator from 'delaunator';
    const { initGenerator, loadOptions, generateMap, getMapData, renderPreviewSVG } = 
      await import('../dist/azgaar-genesis.esm.js');

    const svgContainer = document.getElementById('svgContainer');
    const testBtn = document.getElementById('testBtn');
    const inspectBtn = document.getElementById('inspectBtn');
    const resultsDiv = document.getElementById('results');

    function log(message, type = 'info') {
      const color = type === 'error' ? '#f44' : type === 'success' ? '#4f4' : '#aaa';
      resultsDiv.innerHTML += `<div style="color: ${color};">${message}</div>`;
      console.log(`[${type.toUpperCase()}]`, message);
    }

    function clearResults() {
      resultsDiv.innerHTML = '';
    }

    testBtn.addEventListener('click', async () => {
      clearResults();
      log('Starting SVG rendering test with full vertex graph...', 'info');
      
      try {
        // Initialize
        initGenerator({ container: svgContainer });
        log('✓ Generator initialized', 'success');
        
        // Load options - use default seed for consistency in testing
        const seed = '8678460'; // Use seed from screenshot reference
        loadOptions({
          seed: seed,
          mapWidth: 960,
          mapHeight: 540,
          points: 4, // ~10,000 cells
          statesNumber: 20,
          cultures: 15,
          fullRendering: true, // Force full pack creation
        });
        log(`✓ Options loaded (seed: ${seed})`, 'success');
        
        // Generate map
        log('Generating map...', 'info');
        const startTime = performance.now();
        const data = generateMap(Delaunator);
        const genTime = ((performance.now() - startTime) / 1000).toFixed(2);
        log(`✓ Map generated in ${genTime}s`, 'success');
        
        // Inspect vertex graph
        const pack = data.pack;
        
        // Debug: Log directly from pack object to verify structure (lifecycle check)
        console.log('[test:lifecycle] Received pack immediately after generateMap():', {
          dataHasPack: 'pack' in data,
          hasCells: !!pack.cells,
          hasV: pack.cells?.v !== undefined,
          hasVCoords: pack.cells?.vCoords !== undefined,
          vType: typeof pack.cells?.v,
          vIsArray: Array.isArray(pack.cells?.v),
          vLength: pack.cells?.v?.length,
          vCoordsType: typeof pack.cells?.vCoords,
          vCoordsIsArray: Array.isArray(pack.cells?.vCoords),
          vCoordsLength: pack.cells?.vCoords?.length,
          v0: pack.cells?.v?.[0],
          vCoords0: pack.cells?.vCoords?.[0],
          cellsKeys: pack.cells ? Object.keys(pack.cells) : [],
          v0Sample: pack.cells?.v?.[0] ? JSON.stringify(pack.cells.v[0].slice(0, 3)) : 'undefined',
          vCoords0Sample: pack.cells?.vCoords?.[0] ? JSON.stringify(pack.cells.vCoords[0].slice(0, 2)) : 'undefined',
        });
        log('--- Vertex Graph Inspection ---', 'info');
        log(`vertices.c length: ${pack.vertices?.c?.length || 0}`, 
            pack.vertices?.c?.length > 0 ? 'success' : 'error');
        log(`vertices.p length: ${pack.vertices?.p?.length || 0}`, 'info');
        log(`vertices.v length: ${pack.vertices?.v?.length || 0}`, 
            pack.vertices?.v?.length > 0 ? 'success' : 'error');
        
        // Check cells.v structure (should be vertex indices now)
        // Debug: Check if v exists and what type it is
        const hasV = pack.cells?.v !== undefined;
        const vIsArray = Array.isArray(pack.cells?.v);
        // For sparse arrays, length might not reflect actual content
        // Check if array has any properties/indices
        let vLength = 0;
        let vNonEmptyCount = 0;
        if (hasV && vIsArray) {
          vLength = pack.cells.v.length || 0;
          // Count non-empty entries
          for (let i = 0; i < Math.min(pack.cells.i.length, 1000); i++) {
            if (pack.cells.v[i] !== undefined && Array.isArray(pack.cells.v[i]) && pack.cells.v[i].length > 0) {
              vNonEmptyCount++;
            }
          }
        }
        log(`cells.v exists: ${hasV}, isArray: ${vIsArray}, length: ${vLength}, non-empty (first 1000): ${vNonEmptyCount}`, 
            hasV && vNonEmptyCount > 0 ? 'success' : 'error');
        
        if (hasV && vNonEmptyCount > 0) {
          // Find first non-empty entry
          let firstCellV = null;
          let firstIndex = -1;
          for (let i = 0; i < pack.cells.i.length; i++) {
            if (pack.cells.v[i] && Array.isArray(pack.cells.v[i]) && pack.cells.v[i].length > 0) {
              firstCellV = pack.cells.v[i];
              firstIndex = i;
              break;
            }
          }
          
          if (firstCellV) {
            const isCoordinates = Array.isArray(firstCellV[0]) && firstCellV[0].length === 2;
            log(`cells.v[${firstIndex}] type: ${isCoordinates ? 'POLYGON COORDINATES (ERROR!)' : 'VERTEX INDICES (CORRECT)'}`, 
                isCoordinates ? 'error' : 'success');
            log(`cells.v[${firstIndex}] sample: ${JSON.stringify(firstCellV.slice(0, 3))}`, 'info');
          }
        } else {
          log('⚠ cells.v is missing or empty - pack may not have been created with full graph', 'error');
        }
        
        // Check cells.vCoords (should be polygon coordinates)
        const hasVCoords = pack.cells?.vCoords !== undefined;
        const vCoordsIsArray = Array.isArray(pack.cells?.vCoords);
        let vCoordsLength = 0;
        let vCoordsNonEmptyCount = 0;
        if (hasVCoords && vCoordsIsArray) {
          vCoordsLength = pack.cells.vCoords.length || 0;
          // Count non-empty entries (check up to 1000 cells)
          for (let i = 0; i < Math.min(pack.cells.i.length, 1000); i++) {
            if (pack.cells.vCoords[i] !== undefined && Array.isArray(pack.cells.vCoords[i]) && pack.cells.vCoords[i].length > 0) {
              vCoordsNonEmptyCount++;
            }
          }
        }
        log(`cells.vCoords exists: ${hasVCoords}, isArray: ${vCoordsIsArray}, length: ${vCoordsLength}, non-empty (first 1000): ${vCoordsNonEmptyCount}`, 
            hasVCoords && vCoordsNonEmptyCount > 0 ? 'success' : 'error');
        
        if (hasVCoords && vCoordsNonEmptyCount > 0) {
          // Find first non-empty entry
          let firstCellVCoords = null;
          let firstIndex = -1;
          for (let i = 0; i < pack.cells.i.length; i++) {
            if (pack.cells.vCoords[i] && Array.isArray(pack.cells.vCoords[i]) && pack.cells.vCoords[i].length > 0) {
              firstCellVCoords = pack.cells.vCoords[i];
              firstIndex = i;
              break;
            }
          }
          
          if (firstCellVCoords) {
            log(`cells.vCoords[${firstIndex}] type: POLYGON COORDINATES (CORRECT)`, 'success');
            log(`cells.vCoords[${firstIndex}] sample: ${JSON.stringify(firstCellVCoords.slice(0, 2))}`, 'info');
          }
        } else {
          log('⚠ cells.vCoords not found (may cause canvas rendering issues)', 'error');
        }
        
        // Check vertex graph connectivity
        if (pack.vertices?.c && pack.vertices.c.length > 0) {
          const nonEmpty = pack.vertices.c.filter(v => v && v.length > 0).length;
          log(`vertices.c non-empty: ${nonEmpty}/${pack.vertices.c.length}`, 'info');
        }
        
        // Attempt SVG rendering
        log('--- SVG Rendering Attempt ---', 'info');
        const renderStart = performance.now();
        try {
          renderPreviewSVG({
            width: 960,
            height: 540,
            container: svgContainer
          });
          const renderTime = ((performance.now() - renderStart) / 1000).toFixed(2);
          const hasSVG = svgContainer.innerHTML.length > 0;
          if (hasSVG) {
            log(`✓ SVG rendered in ${renderTime}s`, 'success');
            log(`SVG content length: ${svgContainer.innerHTML.length} characters`, 'info');
          } else {
            log(`⚠ SVG rendering completed but container is empty`, 'error');
          }
        } catch (error) {
          const renderTime = ((performance.now() - renderStart) / 1000).toFixed(2);
          log(`✗ Error: SVG rendering failed: ${error.message}`, 'error');
          log(`Stack: ${error.stack}`, 'error');
          log(`Rendering failed after ${renderTime}s`, 'error');
          // Check if any SVG was rendered despite the error
          const hasSVG = svgContainer.innerHTML.length > 0;
          if (hasSVG) {
            log(`⚠ Error occurred but SVG was partially rendered (${svgContainer.innerHTML.length} chars)`, 'error');
          }
        }
        
        // Check if SVG was created
        const svg = svgContainer.querySelector('svg');
        if (svg) {
          log(`✓ SVG element created with ${svg.children.length} children`, 'success');
          log(`SVG viewBox: ${svg.getAttribute('viewBox')}`, 'info');
          
          // Check for key layers and log their content length
          const biomesLayer = svg.querySelector('#biomes');
          const statesLayer = svg.querySelector('#states');
          const bordersLayer = svg.querySelector('#borders');
          
          if (biomesLayer) {
            const biomesContent = biomesLayer.innerHTML.trim();
            log(`  - Biomes layer: ✓ (${biomesContent.length} chars)`, 'success');
            const biomeGroups = biomesLayer.querySelectorAll('g[id^="biome-"]');
            log(`    Biome groups: ${biomeGroups.length}`, 'info');
          } else {
            log(`  - Biomes layer: ✗`, 'error');
          }
          
          if (statesLayer) {
            const statesContent = statesLayer.innerHTML.trim();
            log(`  - States layer: ✓ (${statesContent.length} chars)`, 'success');
            const stateGroups = statesLayer.querySelectorAll('g[id^="state-"]');
            log(`    State groups: ${stateGroups.length}`, 'info');
          } else {
            log(`  - States layer: ✗`, 'error');
          }
          
          if (bordersLayer) {
            const bordersContent = bordersLayer.innerHTML.trim();
            log(`  - Borders layer: ✓ (${bordersContent.length} chars)`, 'success');
          } else {
            log(`  - Borders layer: ✗`, 'error');
          }
          
          // Log full SVG structure summary
          log('--- SVG Structure Summary ---', 'info');
          log(`Total SVG content: ${svgContainer.innerHTML.length} characters`, 'info');
          log(`SVG children: ${svg.children.length}`, 'info');
          Array.from(svg.children).forEach((child, idx) => {
            const id = child.id || child.tagName;
            const contentLength = child.innerHTML ? child.innerHTML.trim().length : 0;
            log(`  Layer ${idx + 1}: ${id} (${contentLength} chars)`, 'info');
          });
        } else {
          log('✗ No SVG element found in container', 'error');
        }
        
        // Detailed pack structure logging
        log('--- Pack Structure Summary ---', 'info');
        log(`cells.i.length: ${pack.cells?.i?.length || 0}`, 'info');
        log(`cells.v.length: ${pack.cells?.v?.length || 0}`, 'info');
        log(`cells.vCoords.length: ${pack.cells?.vCoords?.length || 0}`, 'info');
        log(`vertices.p.length: ${pack.vertices?.p?.length || 0}`, 'info');
        log(`vertices.v.length: ${pack.vertices?.v?.length || 0}`, 'info');
        log(`vertices.c.length: ${pack.vertices?.c?.length || 0}`, 'info');
        
        // Sample data verification
        if (pack.cells?.v?.[0]) {
          const firstV = pack.cells.v[0];
          const isVertexIndices = Array.isArray(firstV) && firstV.length > 0 && typeof firstV[0] === 'number';
          log(`cells.v[0] contains: ${isVertexIndices ? 'VERTEX INDICES ✓' : 'COORDINATES ✗'}`, 
              isVertexIndices ? 'success' : 'error');
          log(`cells.v[0] sample: [${firstV.slice(0, 3).join(', ')}...]`, 'info');
        }
        
        if (pack.cells?.vCoords?.[0]) {
          const firstVCoords = pack.cells.vCoords[0];
          const isCoords = Array.isArray(firstVCoords) && firstVCoords.length > 0 && Array.isArray(firstVCoords[0]);
          log(`cells.vCoords[0] contains: ${isCoords ? 'POLYGON COORDINATES ✓' : 'INVALID ✗'}`, 
              isCoords ? 'success' : 'error');
          log(`cells.vCoords[0] length: ${firstVCoords.length}`, 'info');
        }
        
        // Vertex graph connectivity check
        if (pack.vertices?.c && pack.vertices.c.length > 0) {
          const nonEmptyC = pack.vertices.c.filter(v => v && Array.isArray(v) && v.length > 0).length;
          const avgCellsPerVertex = pack.vertices.c
            .filter(v => v && Array.isArray(v) && v.length > 0)
            .reduce((sum, v) => sum + v.length, 0) / nonEmptyC;
          log(`vertices.c populated: ${nonEmptyC}/${pack.vertices.c.length} (avg ${avgCellsPerVertex.toFixed(1)} cells/vertex)`, 
              nonEmptyC > 0 ? 'success' : 'error');
        }
        
        if (pack.vertices?.v && pack.vertices.v.length > 0) {
          const nonEmptyV = pack.vertices.v.filter(v => v && Array.isArray(v) && v.length > 0).length;
          const avgVerticesPerVertex = pack.vertices.v
            .filter(v => v && Array.isArray(v) && v.length > 0)
            .reduce((sum, v) => sum + v.length, 0) / nonEmptyV;
          log(`vertices.v populated: ${nonEmptyV}/${pack.vertices.v.length} (avg ${avgVerticesPerVertex.toFixed(1)} vertices/vertex)`, 
              nonEmptyV > 0 ? 'success' : 'error');
        }
        
      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
        log(`Stack: ${error.stack}`, 'error');
        console.error('Full error:', error);
      }
    });

    inspectBtn.addEventListener('click', async () => {
      clearResults();
      log('Inspecting vertex graph structure...', 'info');
      
      try {
        initGenerator({ container: svgContainer });
        loadOptions({
          seed: '42',
          mapWidth: 960,
          mapHeight: 540,
          points: 4,
        });
        
        const data = generateMap(Delaunator);
        const pack = data.pack;
        
        log('--- Pack Structure ---', 'info');
        log(`Pack cells count: ${pack.cells?.i?.length || 0}`, 'info');
        log(`Pack vertices.p count: ${pack.vertices?.p?.length || 0}`, 'info');
        log(`Pack vertices.c count: ${pack.vertices?.c?.length || 0}`, 
            pack.vertices?.c?.length > 0 ? 'success' : 'error');
        log(`Pack vertices.v count: ${pack.vertices?.v?.length || 0}`, 
            pack.vertices?.v?.length > 0 ? 'success' : 'error');
        
        // Sample cells.v
        if (pack.cells?.v && pack.cells.v.length > 0) {
          const sample = pack.cells.v[0];
          log(`cells.v[0] type: ${Array.isArray(sample[0]) ? 'coordinates' : 'indices'}`, 'info');
          log(`cells.v[0] length: ${sample.length}`, 'info');
          log(`cells.v[0] first 3: ${JSON.stringify(sample.slice(0, 3))}`, 'info');
        }
        
        // Check vertices.c
        if (pack.vertices?.c && pack.vertices.c.length > 0) {
          const nonEmpty = pack.vertices.c.filter(v => v && v.length > 0).length;
          log(`vertices.c non-empty entries: ${nonEmpty}/${pack.vertices.c.length}`, 'info');
          if (nonEmpty > 0) {
            const sample = pack.vertices.c.find(v => v && v.length > 0);
            log(`vertices.c sample: ${JSON.stringify(sample)}`, 'info');
          }
        } else {
          log('✗ vertices.c is empty or undefined', 'error');
        }
        
        // Check vertices.v
        if (pack.vertices?.v && pack.vertices.v.length > 0) {
          const nonEmpty = pack.vertices.v.filter(v => v && v.length > 0).length;
          log(`vertices.v non-empty entries: ${nonEmpty}/${pack.vertices.v.length}`, 'info');
        } else {
          log('✗ vertices.v is empty or undefined', 'error');
        }
        
      } catch (error) {
        log(`✗ Error: ${error.message}`, 'error');
        console.error('Full error:', error);
      }
    });
  </script>
</body>
</html>
