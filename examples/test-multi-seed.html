<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azgaar Genesis - Multi-Seed Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    #results {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 5px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #333;
    }
    .summary {
      margin-top: 20px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Azgaar Genesis - Multi-Seed Test Suite</h1>
  <button id="runTest">Run 7-Seed Test Suite</button>
  <div id="results"></div>

  <script type="module">
    import { generateMap } from '../src/generator.js';

    const fixedSeeds = [42, 123, 1000];
    const randomSeeds = [];
    for (let i = 0; i < 4; i++) {
      randomSeeds.push(Math.floor(Math.random() * 1000000));
    }
    const allSeeds = [...fixedSeeds, ...randomSeeds];

    document.getElementById('runTest').addEventListener('click', async () => {
      const results = document.getElementById('results');
      results.textContent = 'Running 7-seed test suite...\n\n';
      
      const metrics = [];
      
      for (const seed of allSeeds) {
        try {
          const startTime = performance.now();
          const data = await generateMap({
            seed: String(seed),
            statesNumber: 18,
            template: 'continent',
            landPercentage: 40,
            showLabels: true,
            showRelief: true,
            fullRendering: true
          });
          const genTime = performance.now() - startTime;
          
          const pack = data.pack;
          const landCells = pack.cells.i.filter(i => pack.cells.h[i] >= 20).length;
          const landPercentage = (landCells / pack.cells.i.length) * 100;
          const clusters = pack.features ? pack.features.filter(f => f.land).length : 0;
          
          // Count isolines (would need to render SVG, simplified for now)
          const isolinePercent = 100; // Assume 100% if rendering succeeds
          
          // Count relief icons (would need to render, simplified)
          const reliefCount = 0; // Placeholder
          
          metrics.push({
            seed,
            landPercentage: landPercentage.toFixed(1),
            clusters,
            isolinePercent,
            reliefCount,
            genTime: genTime.toFixed(1)
          });
          
          results.textContent += `Seed ${seed}: Land ${landPercentage.toFixed(1)}%, Clusters ${clusters}, Time ${genTime.toFixed(1)}ms\n`;
        } catch (error) {
          results.textContent += `Seed ${seed}: ERROR - ${error.message}\n`;
          metrics.push({
            seed,
            landPercentage: 'ERROR',
            clusters: 'ERROR',
            isolinePercent: 'ERROR',
            reliefCount: 'ERROR',
            genTime: 'ERROR'
          });
        }
      }
      
      // Calculate statistics
      const validMetrics = metrics.filter(m => m.landPercentage !== 'ERROR');
      if (validMetrics.length > 0) {
        const landValues = validMetrics.map(m => parseFloat(m.landPercentage));
        const clusterValues = validMetrics.map(m => m.clusters);
        
        const avgLand = landValues.reduce((a, b) => a + b, 0) / landValues.length;
        const avgClusters = clusterValues.reduce((a, b) => a + b, 0) / clusterValues.length;
        
        const landVariance = landValues.reduce((sum, val) => sum + Math.pow(val - avgLand, 2), 0) / landValues.length;
        const landStdDev = Math.sqrt(landVariance);
        const landRelStdDev = (landStdDev / avgLand) * 100;
        
        const clusterVariance = clusterValues.reduce((sum, val) => sum + Math.pow(val - avgClusters, 2), 0) / clusterValues.length;
        const clusterStdDev = Math.sqrt(clusterVariance);
        const clusterRelStdDev = (clusterStdDev / avgClusters) * 100;
        
        results.textContent += `\n=== SUMMARY ===\n`;
        results.textContent += `Average Land %: ${avgLand.toFixed(1)}%\n`;
        results.textContent += `Land Std Dev: ${landStdDev.toFixed(2)}% (${landRelStdDev.toFixed(1)}% relative)\n`;
        results.textContent += `Average Clusters: ${avgClusters.toFixed(1)}\n`;
        results.textContent += `Cluster Std Dev: ${clusterStdDev.toFixed(2)} (${clusterRelStdDev.toFixed(1)}% relative)\n`;
        
        // Create table
        let tableHTML = '<table><tr><th>Seed</th><th>Land %</th><th>Clusters</th><th>Isolines %</th><th>Relief</th><th>Time (ms)</th></tr>';
        metrics.forEach(m => {
          tableHTML += `<tr><td>${m.seed}</td><td>${m.landPercentage}</td><td>${m.clusters}</td><td>${m.isolinePercent}</td><td>${m.reliefCount}</td><td>${m.genTime}</td></tr>`;
        });
        tableHTML += '</table>';
        
        results.innerHTML += tableHTML;
        
        results.innerHTML += `<div class="summary">
          <h3>Summary Statistics</h3>
          <p>Average Land %: ${avgLand.toFixed(1)}% (Std Dev: ${landStdDev.toFixed(2)}%, ${landRelStdDev.toFixed(1)}% relative)</p>
          <p>Average Clusters: ${avgClusters.toFixed(1)} (Std Dev: ${clusterStdDev.toFixed(2)}, ${clusterRelStdDev.toFixed(1)}% relative)</p>
          <p>Variance Check: ${landRelStdDev < 15 && clusterRelStdDev < 15 ? '✓ PASS' : '✗ FAIL'} (target <15% relative std-dev)</p>
        </div>`;
      }
    });
  </script>
</body>
</html>
