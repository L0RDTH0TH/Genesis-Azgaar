<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azgaar Genesis - Basic Canvas Rendering Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      margin-bottom: 10px;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #canvas {
      border: 2px solid #444;
      background: #000;
      display: block;
      margin-top: 20px;
    }
    .info {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }
    .error {
      color: #f44;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Azgaar Genesis - Basic Canvas Rendering Test</h1>
  <p>This example demonstrates basic canvas rendering with seed 42.</p>
  
  <div class="controls">
    <button id="generateBtn">Generate Map (Seed: 42)</button>
    <button id="randomBtn">Generate Random Map</button>
  </div>

  <canvas id="canvas"></canvas>
  
  <div class="info" id="info"></div>
  <div class="error" id="error"></div>

  <script type="module">
    // Import Delaunator (peer dependency)
    import Delaunator from 'https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm';
    
    // Import the library (using dev server or dist bundle)
    // For dev: use /src/index.js via Vite dev server
    // For production: use /dist/azgaar-library.es.js
    const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const libraryPath = isDev 
      ? '/src/index.js' 
      : '/dist/azgaar-library.es.js';
    
    import { generateMap, renderMap } from libraryPath;

    const canvas = document.getElementById('canvas');
    const generateBtn = document.getElementById('generateBtn');
    const randomBtn = document.getElementById('randomBtn');
    const infoDiv = document.getElementById('info');
    const errorDiv = document.getElementById('error');

    function clearError() {
      errorDiv.textContent = '';
    }

    function showError(message) {
      errorDiv.textContent = `Error: ${message}`;
      console.error(message);
    }

    function showInfo(message) {
      infoDiv.textContent = message;
    }

    async function generateMapWithSeed(seed) {
      clearError();
      generateBtn.disabled = true;
      randomBtn.disabled = true;
      
      try {
        showInfo('Generating map...');
        const startTime = performance.now();

        // Generate map with fixed seed
        const data = generateMap(
          { 
            seed: seed || String(Date.now()),
            mapWidth: 960,
            mapHeight: 540,
            cellsDesired: 10000
          },
          Delaunator
        );

        const generateTime = performance.now() - startTime;
        showInfo(`Map generated in ${generateTime.toFixed(2)}ms (seed: ${data.seed})`);

        // Render to canvas
        const renderStart = performance.now();
        renderMap(canvas, data);
        const renderTime = performance.now() - renderStart;
        
        showInfo(
          `Map generated in ${generateTime.toFixed(2)}ms, ` +
          `rendered in ${renderTime.toFixed(2)}ms (seed: ${data.seed})`
        );

        console.log('Generated map data:', {
          seed: data.seed,
          gridCells: data.grid.cells.i.length,
          packCells: data.pack.cells.i.length,
          features: data.pack.features?.length || 0,
          burgs: data.pack.burgs?.length || 0,
          states: data.pack.states?.length || 0
        });

      } catch (error) {
        showError(error.message);
        console.error('Generation error:', error);
      } finally {
        generateBtn.disabled = false;
        randomBtn.disabled = false;
      }
    }

    // Event listeners
    generateBtn.addEventListener('click', () => generateMapWithSeed('42'));
    randomBtn.addEventListener('click', () => generateMapWithSeed(null));

    // Auto-generate on load with seed 42
    window.addEventListener('load', () => {
      setTimeout(() => generateMapWithSeed('42'), 100);
    });
  </script>
</body>
</html>
