<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azgaar Genesis - Full 14-Template Validation Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      color: #fff;
      border-bottom: 2px solid #4a9eff;
      padding-bottom: 10px;
    }
    .controls {
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #5aaeff;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status.running {
      background: #ffaa00;
      color: #000;
    }
    .status.complete {
      background: #4caf50;
      color: #fff;
    }
    .results {
      margin-top: 20px;
    }
    .map-container {
      margin: 30px 0;
      padding: 20px;
      background: #2a2a2a;
      border-radius: 8px;
      border-left: 4px solid #4a9eff;
      page-break-inside: avoid;
    }
    .map-container h2 {
      color: #4a9eff;
      margin-top: 0;
    }
    .map-container img {
      max-width: 100%;
      border: 2px solid #4a9eff;
      border-radius: 5px;
      margin-top: 10px;
      display: block;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .metric {
      padding: 8px;
      background: #333;
      border-radius: 4px;
    }
    .metric strong {
      color: #4a9eff;
    }
  </style>
</head>
<body>
  <h1>Azgaar Genesis - Full 14-Template Validation Suite</h1>
  <div class="controls">
    <button id="runBtn">Run Full Suite (14 Templates × 3 Seeds = 42 Maps)</button>
    <span id="status" class="status"></span>
  </div>
  <div id="results" class="results"></div>

  <script type="module">
    import { initGenerator, loadOptions, generateMap, renderMapSVG } from '../dist/azgaar-genesis.esm.js';
    import Delaunator from 'https://cdn.jsdelivr.net/npm/delaunator@5.0.0/+esm';

    const templates = [
      'Volcano', 'High Island', 'Low Island', 'Continents', 'Archipelago', 'Atoll',
      'Mediterranean', 'Peninsula', 'Pangea', 'Isthmus', 'Shattered', 'Taklamakan',
      'Old World', 'Fractious'
    ];

    const fixedSeeds = [42];
    const resultsContainer = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const runBtn = document.getElementById('runBtn');

    let allResults = [];
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);

    async function generateMapWithDiagnostics(template, seed, options) {
      const startTime = performance.now();
      
      try {
        // Load options for this specific map
        loadOptions({
          ...options,
          seed: seed.toString(),
          template: template
        });
        
        // Generate map
        const data = generateMap(Delaunator);
        
        // Render to SVG
        const svg = renderMapSVG(data, {
          ...options,
          showLabels: true,
          showRelief: true,
          fullRendering: true
        });
        
        const result = {
          ...data,
          svg
        };

        const endTime = performance.now();
        const generationTime = ((endTime - startTime) / 1000).toFixed(2);

        // Calculate diagnostics
        const pack = result.pack;
        const landCells = pack.cells.i.filter(i => pack.cells.h[i] >= 20);
        const landPercentage = ((landCells.length / pack.cells.i.length) * 100).toFixed(1);
        const features = pack.features || [];
        const landFeatures = features.filter(f => f && f.land);
        const clusters = landFeatures.length;
        
        // Count isolines (approximate from SVG)
        const svg = result.svg || '';
        const isolinePaths = (svg.match(/<path[^>]*d="[^"]*"[^>]*>/g) || []).length;
        const polygonPaths = (svg.match(/<polygon[^>]*>/g) || []).length;
        const totalPaths = isolinePaths + polygonPaths;
        const isolinePercentage = totalPaths > 0 ? ((isolinePaths / totalPaths) * 100).toFixed(1) : '0.0';
        
        // Count relief icons
        const reliefMatches = svg.match(/<use[^>]*href="#relief[^"]*"/g) || [];
        const reliefCount = reliefMatches.length;

        return {
          template,
          seed,
          svg,
          diagnostics: {
            landPercentage: parseFloat(landPercentage),
            clusters,
            isolinePercentage: parseFloat(isolinePercentage),
            reliefCount,
            generationTime: parseFloat(generationTime)
          },
          result
        };
      } catch (error) {
        console.error(`Error generating ${template} / Seed ${seed}:`, error);
        return {
          template,
          seed,
          error: error.message,
          diagnostics: null
        };
      }
    }

    async function takeScreenshot(element, filename) {
      return new Promise((resolve) => {
        // Create canvas from SVG
        const svgData = element.querySelector('svg')?.outerHTML || '';
        if (!svgData) {
          resolve(null);
          return;
        }

        const img = new Image();
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width || 1200;
          canvas.height = img.height || 800;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64 = reader.result;
              // Save via download (browser will handle)
              const a = document.createElement('a');
              a.href = base64;
              a.download = filename;
              a.click();
              URL.revokeObjectURL(url);
              resolve(base64);
            };
            reader.readAsDataURL(blob);
          }, 'image/png');
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };

        img.src = url;
      });
    }

    function createMapContainer(template, seed, diagnostics, svg) {
      const container = document.createElement('div');
      container.className = 'map-container';
      container.id = `map-${template}-${seed}`;

      const title = document.createElement('h2');
      title.textContent = `${template} - Seed ${seed}`;
      container.appendChild(title);

      const metricsDiv = document.createElement('div');
      metricsDiv.className = 'metrics';
      
      if (diagnostics) {
        metricsDiv.innerHTML = `
          <div class="metric"><strong>Land %:</strong> ${diagnostics.landPercentage}%</div>
          <div class="metric"><strong>Clusters:</strong> ${diagnostics.clusters}</div>
          <div class="metric"><strong>Isolines:</strong> ${diagnostics.isolinePercentage}%</div>
          <div class="metric"><strong>Relief:</strong> ${diagnostics.reliefCount}</div>
          <div class="metric"><strong>Time:</strong> ${diagnostics.generationTime}s</div>
        `;
      } else {
        metricsDiv.innerHTML = '<div class="metric"><strong>Error:</strong> Generation failed</div>';
      }
      
      container.appendChild(metricsDiv);

      if (svg) {
        const svgContainer = document.createElement('div');
        svgContainer.innerHTML = svg;
        container.appendChild(svgContainer);
      }

      return container;
    }

    async function runFullSuite() {
      runBtn.disabled = true;
      statusEl.textContent = 'Running...';
      statusEl.className = 'status running';
      resultsContainer.innerHTML = '';
      allResults = [];

      const allSeeds = [...fixedSeeds];
      // Add 2 random seeds
      const baseTime = Date.now();
      allSeeds.push(Math.floor(baseTime / 1000));
      allSeeds.push(Math.floor((baseTime + 1000) / 1000));

      let mapIndex = 0;
      const totalMaps = templates.length * allSeeds.length;

      for (const template of templates) {
        for (const seed of allSeeds) {
          mapIndex++;
          statusEl.textContent = `Generating ${template} / Seed ${seed}... (${mapIndex}/${totalMaps})`;

          const result = await generateMapWithDiagnostics(template, seed, {
            statesNumber: 18,
            showLabels: true,
            showRelief: true,
            fullRendering: true,
            enforceLandPercentage: false
          });

          allResults.push(result);

          // Create and append container
          const container = createMapContainer(
            result.template,
            result.seed,
            result.diagnostics,
            result.svg
          );
          resultsContainer.appendChild(container);

          // Scroll to new map
          container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

          // Take screenshot (save as base64 for now, will download)
          if (result.svg && !result.error) {
            const filename = `${result.seed}_${result.template.replace(/\s+/g, '_')}.png`;
            await takeScreenshot(container, filename);
          }

          // Small delay to prevent browser freeze
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      statusEl.textContent = `Complete! All ${totalMaps} maps generated.`;
      statusEl.className = 'status complete';
      runBtn.disabled = false;

      // Generate report
      generateReport();
    }

    function generateReport() {
      const report = {
        timestamp,
        totalMaps: allResults.length,
        templates: {},
        summary: {}
      };

      // Group by template
      for (const result of allResults) {
        if (!result.diagnostics) continue;
        
        const template = result.template;
        if (!report.templates[template]) {
          report.templates[template] = {
            results: [],
            averages: {}
          };
        }
        report.templates[template].results.push({
          seed: result.seed,
          ...result.diagnostics
        });
      }

      // Calculate averages per template
      for (const [template, data] of Object.entries(report.templates)) {
        const results = data.results;
        if (results.length === 0) continue;

        data.averages = {
          landPercentage: (results.reduce((sum, r) => sum + r.landPercentage, 0) / results.length).toFixed(1),
          clusters: (results.reduce((sum, r) => sum + r.clusters, 0) / results.length).toFixed(1),
          isolinePercentage: (results.reduce((sum, r) => sum + r.isolinePercentage, 0) / results.length).toFixed(1),
          reliefCount: (results.reduce((sum, r) => sum + r.reliefCount, 0) / results.length).toFixed(0),
          generationTime: (results.reduce((sum, r) => sum + r.generationTime, 0) / results.length).toFixed(2)
        };
      }

      // Overall summary
      const allDiagnostics = allResults.filter(r => r.diagnostics).map(r => r.diagnostics);
      if (allDiagnostics.length > 0) {
        report.summary = {
          avgLandPercentage: (allDiagnostics.reduce((sum, d) => sum + d.landPercentage, 0) / allDiagnostics.length).toFixed(1),
          avgClusters: (allDiagnostics.reduce((sum, d) => sum + d.clusters, 0) / allDiagnostics.length).toFixed(1),
          avgIsolinePercentage: (allDiagnostics.reduce((sum, d) => sum + d.isolinePercentage, 0) / allDiagnostics.length).toFixed(1),
          avgReliefCount: (allDiagnostics.reduce((sum, d) => sum + d.reliefCount, 0) / allDiagnostics.length).toFixed(0),
          avgGenerationTime: (allDiagnostics.reduce((sum, d) => sum + d.generationTime, 0) / allDiagnostics.length).toFixed(2)
        };
      }

      // Store report in global for download
      window.testReport = report;
      console.log('Test Report Generated:', report);
    }

    runBtn.addEventListener('click', runFullSuite);
  </script>
</body>
</html>
