<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azgaar Genesis - Full 14-Template Validation Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      color: #fff;
      border-bottom: 2px solid #4a9eff;
      padding-bottom: 10px;
    }
    .controls {
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #5aaeff;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status.running {
      background: #ffaa00;
      color: #000;
    }
    .status.complete {
      background: #4caf50;
      color: #fff;
    }
    .results {
      margin-top: 20px;
    }
    .map-result {
      margin: 20px 0;
      padding: 20px;
      background: #2a2a2a;
      border-radius: 8px;
      border-left: 4px solid #4a9eff;
      page-break-inside: avoid;
    }
    .map-result h3 {
      color: #4a9eff;
      margin-top: 0;
    }
    .map-result img {
      max-width: 100%;
      border: 2px solid #4a9eff;
      border-radius: 5px;
      margin-top: 10px;
      display: block;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .metric {
      padding: 8px;
      background: #333;
      border-radius: 4px;
    }
    .metric strong {
      color: #4a9eff;
    }
    .progress {
      margin: 10px 0;
      padding: 10px;
      background: #333;
      border-radius: 5px;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #555;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4a9eff;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>Azgaar Genesis - Full 14-Template Validation Suite</h1>
  
  <div class="controls">
    <button id="runBtn">Run Full Suite (14 Templates × 3 Seeds = 42 Maps)</button>
    <span id="status" class="status"></span>
    <div class="progress" id="progress" style="display: none;">
      <div>Progress: <span id="progressText">0/42</span></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>
  </div>
  
  <div class="results" id="results"></div>

  <script type="module">
    import { initGenerator, generateMap } from '../dist/azgaar-genesis.esm.js';

    const runBtn = document.getElementById('runBtn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const progress = document.getElementById('progress');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');

    // Initialize generator first
    initGenerator();

    // All 14 templates in order
    const allTemplates = [
      'Volcano', 'High Island', 'Low Island', 'Continents', 'Archipelago', 
      'Atoll', 'Mediterranean', 'Peninsula', 'Pangea', 'Isthmus', 
      'Shattered', 'Taklamakan', 'Old World', 'Fractious'
    ];

    // Seeds: fixed 42 + 2 random
    const seeds = [42, Date.now(), Date.now() + 1000];

    let currentMap = 0;
    const totalMaps = allTemplates.length * seeds.length;
    const testResults = [];

    async function generateAndSaveMap(templateName, seed) {
      const options = {
        seed: seed.toString(),
        statesNumber: 18,
        template: templateName,
        showLabels: true,
        showRelief: true,
        fullRendering: true,
        enforceLandPercentage: false
      };

      try {
        const mapData = await generateMap(options);
        
        // Calculate diagnostics
        const pack = mapData.pack;
        const landCells = pack.cells.i.filter(i => pack.cells.h[i] >= 20);
        const landPercentage = ((landCells.length / pack.cells.i.length) * 100).toFixed(1);
        const landFeatures = (pack.features || []).filter(f => f && f.land);
        const clusters = landFeatures.length;
        
        // Count isolines (approximate from SVG)
        const svg = mapData.svg;
        const isolinePaths = (svg.match(/<path[^>]*class="[^"]*isoline[^"]*"/g) || []).length;
        const totalPaths = (svg.match(/<path[^>]*class="[^"]*state[^"]*"/g) || []).length;
        const isolinePercentage = totalPaths > 0 ? ((isolinePaths / totalPaths) * 100).toFixed(1) : '0.0';
        
        // Count relief icons
        const reliefCount = (svg.match(/<use[^>]*href="#relief[^"]*"/g) || []).length;

        // Create result object
        const result = {
          template: templateName,
          seed: seed,
          diagnostics: {
            landPercentage: parseFloat(landPercentage),
            clusters: clusters,
            isolinePercentage: parseFloat(isolinePercentage),
            reliefIcons: reliefCount
          },
          svg: svg
        };

        // Create DOM element for this map
        const mapDiv = document.createElement('div');
        mapDiv.className = 'map-result';
        mapDiv.id = `map-${templateName}-${seed}`;
        
        const img = document.createElement('img');
        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        img.alt = `${templateName} - Seed ${seed}`;
        img.style.maxWidth = '800px';
        
        mapDiv.innerHTML = `
          <h3>${templateName} - Seed ${seed}</h3>
          <div class="metrics">
            <div class="metric"><strong>Land %:</strong> ${landPercentage}%</div>
            <div class="metric"><strong>Clusters:</strong> ${clusters}</div>
            <div class="metric"><strong>Isolines:</strong> ${isolinePercentage}%</div>
            <div class="metric"><strong>Relief Icons:</strong> ${reliefCount}</div>
          </div>
        `;
        mapDiv.appendChild(img);
        
        // Append to results (scrolls downward)
        results.appendChild(mapDiv);
        
        // Scroll to bottom to show latest result
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        return result;
      } catch (error) {
        console.error(`Error generating ${templateName} / Seed ${seed}:`, error);
        return {
          template: templateName,
          seed: seed,
          error: error.message,
          diagnostics: null
        };
      }
    }

    async function runFullSuite() {
      runBtn.disabled = true;
      status.textContent = 'Running...';
      status.className = 'status running';
      progress.style.display = 'block';
      results.innerHTML = '';
      testResults.length = 0;
      currentMap = 0;

      for (const template of allTemplates) {
        for (const seed of seeds) {
          currentMap++;
          const progressPercent = (currentMap / totalMaps) * 100;
          progressText.textContent = `${currentMap}/${totalMaps}`;
          progressFill.style.width = `${progressPercent}%`;
          status.textContent = `Generating ${template} / Seed ${seed}... (${currentMap}/${totalMaps})`;

          const result = await generateAndSaveMap(template, seed);
          testResults.push(result);

          // Small delay to allow UI to update
          await new Promise(resolve => setTimeout(resolve, 100));
        }
      }

      status.textContent = 'Complete! All 42 maps generated.';
      status.className = 'status complete';
      runBtn.disabled = false;
      progress.style.display = 'none';

      // Compile summary
      compileSummary();
    }

    function compileSummary() {
      // Group by template
      const byTemplate = {};
      testResults.forEach(r => {
        if (!r.error && r.diagnostics) {
          if (!byTemplate[r.template]) {
            byTemplate[r.template] = [];
          }
          byTemplate[r.template].push(r.diagnostics);
        }
      });

      // Calculate averages per template
      const summary = Object.entries(byTemplate).map(([template, diags]) => {
        const avgLand = (diags.reduce((s, d) => s + d.landPercentage, 0) / diags.length).toFixed(1);
        const avgClusters = (diags.reduce((s, d) => s + d.clusters, 0) / diags.length).toFixed(1);
        const minClusters = Math.min(...diags.map(d => d.clusters));
        const maxClusters = Math.max(...diags.map(d => d.clusters));
        const avgIsolines = (diags.reduce((s, d) => s + d.isolinePercentage, 0) / diags.length).toFixed(1);
        const avgRelief = (diags.reduce((s, d) => s + d.reliefIcons, 0) / diags.length).toFixed(0);

        return {
          template,
          avgLand: parseFloat(avgLand),
          avgClusters: parseFloat(avgClusters),
          minClusters,
          maxClusters,
          avgIsolines: parseFloat(avgIsolines),
          avgRelief: parseFloat(avgRelief)
        };
      });

      // Create summary section
      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'map-result';
      summaryDiv.style.background = '#1a3a5a';
      summaryDiv.innerHTML = `
        <h2>Summary Statistics</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
          <thead>
            <tr style="background: #2a4a6a;">
              <th style="padding: 8px; text-align: left; border: 1px solid #4a9eff;">Template</th>
              <th style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">Avg Land %</th>
              <th style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">Avg Clusters</th>
              <th style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">Min/Max Clusters</th>
              <th style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">Avg Isolines %</th>
              <th style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">Avg Relief</th>
            </tr>
          </thead>
          <tbody>
            ${summary.map(s => `
              <tr>
                <td style="padding: 8px; border: 1px solid #4a9eff;"><strong>${s.template}</strong></td>
                <td style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">${s.avgLand}%</td>
                <td style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">${s.avgClusters}</td>
                <td style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">${s.minClusters}/${s.maxClusters}</td>
                <td style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">${s.avgIsolines}%</td>
                <td style="padding: 8px; text-align: center; border: 1px solid #4a9eff;">${s.avgRelief}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      results.insertBefore(summaryDiv, results.firstChild);
    }

    runBtn.addEventListener('click', runFullSuite);
  </script>
</body>
</html>
